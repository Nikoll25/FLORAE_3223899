<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Florae — Iniciar sesión</title>
    <link rel="stylesheet" href="login.css">
</head>

<body>

    <!-- Izquierda: logo y slogan -->
    <div class="izquierda">
        <img src="imagenes/logo.png" alt="Logo Florae" style="width: 300px; height: auto;">
        <h1 style="margin-top: -4rem;">Florae</h1>
        <p>Cuida tus plantas con inteligencia. Todo en un solo lugar.</p>
    </div>

    <!-- Derecha: formulario -->
    <div class="derecha">

        <div class="icono-top">
            <img src="/imagenes/Regadera.png" alt="icono">
        </div>
        <div class="center">
            <h2>Iniciar sesión</h2>
            <p class="sub">Bienvenido de nuevo, ingresa tus datos.</p>
        </div>
        <form action="configuracion.html">

            <div class="input-box">
                <img src="/imagenes/Usuario.png" alt="usuario">
                <input type="email" placeholder="Correo electrónico" required>
            </div>

            <div class="input-box">
                <img src="/imagenes/Candado.png" alt="candado">
                <input type="password" placeholder="Contraseña" required>
            </div>

            <a href="#" class="link-olvide">¿Olvidaste tu contraseña?</a>

            <button type="submit" class="btn">Iniciar sesión</button>

        </form>

        <p class="pie">
            ¿No tienes cuenta? <a href="crear-cuenta.html">Crear cuenta</a>
        </p>

    </div>

</body>

</html>
