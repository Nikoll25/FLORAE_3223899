<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Florae — Cerrar sesión</title>
  <link rel="stylesheet" href="cerrar-sesion.css">
</head>
<body>

  <!-- Izquierda: logo y slogan -->
  <div class="izquierda">
    <img src="imagenes/logo.png" alt="Logo Florae">
    <h1>🌿 Florae</h1>
    <p>Cuida tus plantas con inteligencia. Todo en un solo lugar.</p>
  </div>

  <!-- Derecha: confirmación -->
  <div class="derecha">

    <div class="header">
      <img src="imagenes/logo.png" alt="logo">
      <span>Florae</span>
    </div>

    <div class="icono-grande">👋</div>

    <h2>¿Cerrar sesión?</h2>
    <p class="sub">Tu sesión se cerrará. Podrás volver a ingresar cuando quieras.</p>

    <button class="btn-rojo" onclick="window.location='login.html'">
      Sí, cerrar sesión
    </button>

    <button class="btn-gris" onclick="window.location='configuracion.html'">
      Cancelar, volver al panel
    </button>

  </div>

</body>
</html>
