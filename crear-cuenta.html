<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Florae — Crear cuenta</title>
  <link rel="stylesheet" href="crear-cuenta.css">
</head>
<body>

  <!-- Izquierda: logo y slogan -->
  <div class="izquierda">
        <img src="imagenes/logo.png" alt="Logo Florae" style="width: 300px; height: auto;">
        <h1 style="margin-top: -4rem;">Florae</h1>
    <p>Cuida tus plantas con inteligencia. Todo en un solo lugar.</p>
  </div>

  <!-- Derecha: formulario -->
  <div class="derecha">


    <div class="icono-top">
      <img src="/imagenes/Regadera.png" alt="icono">
    </div>

    <div class="center">
      <h2 >Crear cuenta</h2>
      <p class="sub">¿Listo para empezar? Crea tu cuenta ahora.</p>
    </div>

    <form action="configuracion.html">

      <div class="input-box">
        <img src="/imagenes/Usuario.png" alt="usuario">
        <input type="text" placeholder="Nombre completo" required>
      </div>

      <div class="input-box">
        <img src="imagenes/Usuario.png" alt="correo">
        <input type="email" placeholder="Correo electrónico" required>
      </div>

      <div class="input-box">
        <img src="imagenes/Candado.png" alt="candado">
        <input type="password" placeholder="Contraseña" required>
      </div>

      <label class="check">
        <input type="checkbox" required>
        <span>Acepto los términos y condiciones</span>
      </label>

      <button type="submit" class="btn">Crear cuenta</button>

    </form>

    <p class="pie">
      ¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a>
    </p>

  </div>

</body>
</html>
